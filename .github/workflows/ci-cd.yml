name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true

      - name: Restore dependencies
        run: dotnet restore BusinessAnalytics.sln

      - name: Build solution
        run: dotnet build BusinessAnalytics.sln --no-restore -c Release

      - name: Run format check
        run: dotnet format BusinessAnalytics.sln --verify-no-changes

      - name: Run unit tests
        run: dotnet test tests/Domain.Tests/Domain.Tests.csproj --no-build -c Release --logger "trx;LogFileName=domain-tests.trx"

      - name: Run architecture tests
        run: dotnet test tests/Architecture.Tests/Architecture.Tests.csproj --no-build -c Release --logger "trx;LogFileName=architecture-tests.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/**/*.trx

  integration-tests:
    runs-on: ubuntu-latest
    needs: build-and-test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: business_analytics
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: test_password
        ports: 5432:5432
        options: >-
          --health-cmd="pg_isready -U app_user -d business_analytics"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true

      - name: Run integration tests
        run: |
          dotnet restore BusinessAnalytics.sln
          dotnet test tests/Integration.Tests/Integration.Tests.csproj -c Release --logger "trx;LogFileName=integration-tests.trx"
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Database=business_analytics;Username=app_user;Password=test_password;Include Error Detail=true"
          ASPNETCORE_ENVIRONMENT: Testing
          JWT_KEY: test-secret-key-for-testing-only-min-32-chars-long
          JWT_ISSUER: BusinessAnalytics
          JWT_AUDIENCE: BusinessAnalytics

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: tests/**/*.trx

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for vulnerable dependencies
        run: dotnet list BusinessAnalytics.sln package --vulnerable --include-transitive

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [integration-tests, docker-build, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: staging
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy to staging
        run: |
          echo "Deploy to staging environment"
          # Add your staging deployment logic here
          # Example: kubectl apply -f k8s/staging/
          # Or: docker compose -f docker-compose.staging.yml up -d

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Manual approval for production
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.token }}
          approvers: khiwniti
          minimum-approvals: 1
          issue-title: "Production Deployment Approval"
          issue-body: "Please review and approve deployment to production."

      - name: Deploy to production
        run: |
          echo "Deploy to production environment"
          # Add your production deployment logic here
          # Example: kubectl apply -f k8s/production/
          # Or: docker compose -f docker-compose.production.yml up -d

      - name: Run smoke tests against production
        run: |
          echo "Running smoke tests..."
          # Add smoke test execution against production URL
          # curl -f https://api.yourdomain.com/health/live
          # curl -f https://api.yourdomain.com/health/ready