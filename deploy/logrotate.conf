/var/log/business-analytics/*.log {
    daily
    missingok
    rotate 5
    compress
    delaycompress
    notifempty
    create 644 root root
    sharedscripts
    postrotate
        /scripts/rotate-logs.sh > /dev/null 2>&1 || true
    endscript
}

/var/log/business-analytics/operations/*.log {
    size 10M
    missingok
    rotate 5
    compress
    delaycompress
    notifempty
    create 644 root root
}

/var/log/business-analytics/monitoring/*.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 644 root root
}