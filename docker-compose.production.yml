# Production docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.production.yml up -d

version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: business-analytics-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No published ports - internal network only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - business-analytics-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  migrate:
    image: ${DOCKER_REGISTRY}/${IMAGE_NAME}:${TAG:-latest}
    container_name: business-analytics-migrate
    command: ["dotnet", "ef", "database", "update", "--project", "src/BusinessAnalytics.Infrastructure", "--startup-project", "src/BusinessAnalytics.Api"]
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=true"
      ASPNETCORE_ENVIRONMENT: Production
    networks:
      - business-analytics-network
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ${DOCKER_REGISTRY}/${IMAGE_NAME}:${TAG:-latest}
    container_name: business-analytics-api
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=true"
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      JWT_KEY: ${JWT_KEY}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      Cors__Origins__0: ${CORS_ORIGIN_0}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - business-analytics-network
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  backup:
    image: postgres:16-alpine
    container_name: business-analytics-backup
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - postgres_data:/var/lib/postgresql/data:ro
      - backup_data:/backups
    entrypoint: ["/bin/sh", "-c"]
    command: |
      apk add --no-cache bash curl &&
      while true; do
        sleep 86400;
        TIMESTAMP=$$(date +%Y%m%d-%H%M%S);
        pg_dump --format=custom --file="/backups/backup-$${TIMESTAMP}.dump" --host=db --username=${POSTGRES_USER} --dbname=${POSTGRES_DB} &&
        sha256sum "/backups/backup-$${TIMESTAMP}.dump" > "/backups/backup-$${TIMESTAMP}.sha256" &&
        find /backups -name "backup-*.dump" -mtime +${BACKUP_RETENTION_DAYS} -delete &&
        find /backups -name "backup-*.sha256" -mtime +${BACKUP_RETENTION_DAYS} -delete;
      done
    depends_on:
      db:
        condition: service_healthy
    networks:
      - business-analytics-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  monitoring:
    image: prom/prometheus:latest
    container_name: business-analytics-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - business-analytics-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: business-analytics-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - monitoring
    networks:
      - business-analytics-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  backup_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  business-analytics-network:
    driver: bridge