version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: business-analytics-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8080
      - NEXT_PUBLIC_WS_URL=ws://websocket:3001
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=http://localhost:3000
      - AI_PROVIDER=openai
      - AI_MODEL=gpt-4-turbo-preview
      - AI_TEMPERATURE=0.3
    ports:
      - "3000:3000"
    depends_on:
      - api
      - websocket
    networks:
      - business-analytics-network
    restart: unless-stopped

  websocket:
    build:
      context: ./websocket-server
      dockerfile: Dockerfile
    container_name: business-analytics-websocket
    environment:
      - PORT=3001
      - REDIS_URL=redis://redis:6379
    ports:
      - "3001:3001"
    depends_on:
      - redis
    networks:
      - business-analytics-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: business-analytics-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - business-analytics-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
    driver: local

networks:
  business-analytics-network:
    external: true